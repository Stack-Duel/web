name: Deploy Code Preview Runtime

on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "codepreview/**"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit SHA to deploy.
        required: false
        default: main
        type: string
      environment:
        description: Environment to deploy to.
        required: false
        default: Preview
        type: choice
        options:
          - Preview
          - Production

permissions:
  contents: read

concurrency:
  group: deploy-codepreview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/heads/release/') && 'Production' || 'Preview') }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          fetch-depth: 1

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "codepreview"
          api_location: ""
          output_location: ""
          skip_app_build: true
