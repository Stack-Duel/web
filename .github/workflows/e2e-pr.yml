name: E2E Tests (PR)

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    if: ${{ github.event.pull_request.draft == false }}
    uses: ./.github/workflows/e2e-template.yml
    with:
      environment: Development
      grep: "@regression"
    secrets: inherit
