name: Build (template)

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      app-base-url:
        required: false
        type: string
        default: "http://localhost:3000"
      auth0-domain:
        required: false
        type: string
        default: ""
      auth0-callback-url:
        required: false
        type: string
        default: ""
      auth0-audience:
        required: false
        type: string
        default: ""
      api-server-url:
        required: false
        type: string
        default: "http://localhost:5041"
    secrets:
      AUTH0_CLIENT_ID:
        required: false
      AUTH0_SECRET:
        required: false
      AUTH0_CLIENT_SECRET:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ inputs.node-version }}-

      - name: Run lint
        run: pnpm lint

      - name: Run build
        env:
          APP_BASE_URL: ${{ inputs.app-base-url }}
          AUTH0_DOMAIN: ${{ inputs.auth0-domain }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_CALLBACK_URL: ${{ inputs.auth0-callback-url }}
          AUTH0_AUDIENCE: ${{ inputs.auth0-audience }}
          NEXT_PUBLIC_API_SERVER_URL: ${{ inputs.api-server-url }}
        run: pnpm build
