sonar.projectKey=Stack-Duel_web
sonar.organization=stack-duel

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/test/**,.next/**,.source/**,codepreview/**,playwright/**,plop-templates/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Kept in sync with the coverage.exclude list in vitest.config.ts. Written on one line:
# Sonar splits on commas.
sonar.coverage.exclusions=src/test/**,src/shared/components/ui/**,src/shared/lib/auth0.ts,src/shared/lib/api-client.ts,src/shared/lib/react-query.tsx,src/shared/lib/app-insights.tsx,src/shared/lib/signalr/**,src/app/layout.tsx,src/app/opengraph-image.tsx,src/app/twitter-image.tsx,**/proxy.ts
